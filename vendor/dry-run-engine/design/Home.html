<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Main</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@500;700;800&amp;family=Mukta:wght@400;600&amp;display=swap">
  <style>
    body { margin: 0; background: #0E1016; }
    a { color: #F0A830; } a:hover { color: #FFC163; }
  </style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1016; color: #F2ECE0; font-family: 'Mukta', system-ui, sans-serif; display: flex; flex-direction: column;">

  <!-- The chapter's progress (UI.md rule 10, ruled 31 October 2026): months closed in bone-dim,
       the month being played in the timer's colour. The words are the product owner's -->
  <div style="height: 26px; box-sizing: border-box; padding: 8px 24px 0; display: flex; align-items: center; gap: 12px;">
    <span style="font-size: 12px; line-height: 16px; letter-spacing: 0.06em; color: #7C8296; font-weight: 600;">Month 4 of 24</span>
    <div style="position: relative; flex-grow: 1; height: 4px; background: #1A1E29; border-radius: 999px; overflow: hidden;"><div style="position: absolute; top: 0; bottom: 0; left: 0; width: 12.5%; background: #C9CEDD;"></div><div style="position: absolute; top: 0; bottom: 0; left: 12.5%; width: 4.167%; background: #3C4356;"></div></div>
  </div>

  <div style="padding: 12px 24px 0 24px; display: flex; justify-content: space-between; align-items: flex-start;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="font-size: 12px; letter-spacing: 0.08em; color: #7C8296; font-weight: 600;">Chapter one</div>
      <div style="font-family: 'Noto Serif Devanagari', Georgia, serif; font-size: 21px; font-weight: 700; color: #F2ECE0;">First salary</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: flex-end;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <span style="font-size: 13px; font-weight: 600; color: #F0A830;">How it works</span>
      <div style="display: flex; align-items: center; gap: 6px; background: #1A1E29; border-radius: 999px; padding: 7px 13px;">
        <svg width="13" height="16" viewBox="0 0 13 16" fill="none" aria-hidden="true"><path d="M6.5 1C7.5 4 10.5 5 10.5 8.8A4.3 4.3 0 0 1 6.5 15 4.3 4.3 0 0 1 2.5 8.8C2.5 6.4 4 5.4 4.6 3.4c1 .8 1.6 1.6 1.9 2.6C6.9 4.3 6.7 2.6 6.5 1Z" fill="#7C8296"/></svg>
        <span style="font-size: 14px; font-weight: 600; color: #7C8296;">7</span>
      </div>
    </div>
    <!-- The ideas collected (UI.md rule 10): opens them. The product owner's words -->
    <span style="font-size: 13px; line-height: 18px; font-weight: 600; color: #F0A830;">3 of 20 ideas</span>
    </div>
  </div>

  <div style="padding: 34px 24px 0 24px;">
    <div style="font-size: 12px; letter-spacing: 0.08em; color: #7C8296; font-weight: 600;">Net worth</div>
    <div style="display: flex; align-items: baseline; gap: 10px; margin-top: 4px;">
      <div style="font-family: 'Noto Serif Devanagari', Georgia, serif; font-size: 58px; font-weight: 800; line-height: 1; color: #F0A830; font-variant-numeric: tabular-nums;">₹13,700</div>
    </div>
    <div style="display: inline-flex; align-items: center; gap: 5px; margin-top: 10px; background: rgba(46,139,122,0.16); border-radius: 6px; padding: 4px 9px;">
      <svg width="9" height="9" viewBox="0 0 9 9" fill="none" aria-hidden="true"><path d="M4.5 1 8 6.5H1L4.5 1Z" fill="#4FB79E"/></svg>
      <span style="font-size: 13px; font-weight: 600; color: #4FB79E; font-variant-numeric: tabular-nums;">₹5,200 this month</span>
    </div>
  </div>

  <div style="padding: 32px 24px 0 24px; display: flex; flex-direction: column; gap: 18px;">

    <div style="display: flex; flex-direction: column; gap: 7px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <span style="font-size: 14px; font-weight: 600; color: #C9CEDD;">Safety</span>
        <span style="font-size: 13px; color: #7C8296; font-variant-numeric: tabular-nums;">1.2 months of runway</span>
      </div>
      <div style="position: relative; height: 10px; background: #1A1E29; border-radius: 2px; overflow: hidden;">
        <div style="width: 22%; height: 100%; background: #4FB79E;"></div>
        <div style="position: absolute; top: 0; bottom: 0; left: 65%; width: 2px; margin-left: -1px; background: #F2ECE0;"></div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 7px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <span style="font-size: 14px; font-weight: 600; color: #C9CEDD;">Freedom</span>
        <span style="font-size: 13px; color: #7C8296; font-variant-numeric: tabular-nums;">22% committed</span>
      </div>
      <div style="position: relative; height: 10px; background: #1A1E29; border-radius: 2px; overflow: hidden;">
        <div style="width: 78%; height: 100%; background: #7C8296;"></div>
        <div style="position: absolute; top: 0; bottom: 0; left: 42.9%; width: 2px; margin-left: -1px; background: #F2ECE0;"></div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 7px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <span style="font-size: 14px; font-weight: 600; color: #C9CEDD;">Life</span>
        <span style="font-size: 13px; color: #7C8296;"></span>
      </div>
      <div style="position: relative; height: 10px; background: #1A1E29; border-radius: 2px; overflow: hidden;">
        <div style="width: 52%; height: 100%; background: #D6402C;"></div>
        <div style="position: absolute; top: 0; bottom: 0; left: 55%; width: 2px; margin-left: -1px; background: #F2ECE0;"></div>
      </div>
    </div>

  </div>

  <div style="flex-grow: 1;"></div>

  <div style="padding: 0 24px 34px 24px; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; align-items: center; gap: 9px; color: #7C8296;">
      <div style="height: 1px; background: #232838; flex-grow: 1;"></div>
      <span style="font-size: 12px; letter-spacing: 0.06em; font-weight: 600;">Month 4 · you are 22 · <span style="color: #F0A830;">your life so far</span></span>
      <div style="height: 1px; background: #232838; flex-grow: 1;"></div>
    </div>
    <a href="Decision.html" style="display: flex; align-items: center; justify-content: center; height: 62px; background: #F0A830; color: #12141C; border-radius: 10px; text-decoration: none; font-family: 'Noto Serif Devanagari', Georgia, serif; font-size: 20px; font-weight: 700; letter-spacing: 0.01em;">Play the month</a>
  </div>

</div>
</body>
</html>
