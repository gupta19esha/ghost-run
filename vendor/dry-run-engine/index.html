<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Chapter 1</title>
<style>
  :root {
    --bg: #0f1115;
    --surface: #1a1d23;
    --surface-press: #262a32;
    --border: #2c3039;
    --text: #ece8e1;
    --muted: #8b8f98;
    --accent: #d9a860;
    --fit: 1;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .topbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 52px;
    padding: 0 8px 0 20px;
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
  }

  .title {
    font-size: 0.8rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
    padding: 14px 24px 14px 0;
  }

  .quit {
    font: inherit;
    font-size: 0.9rem;
    color: var(--muted);
    background: none;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 16px;
    min-height: 40px;
    cursor: pointer;
  }
  .quit:active { background: var(--surface-press); color: var(--text); }
  .quit.armed { color: var(--bg); background: var(--accent); border-color: var(--accent); }
  .quit[hidden] { display: none; }

  #stage {
    flex: 1 1 auto;
    min-height: 0;
    position: relative;
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
  }

  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: 12px 20px 24px;
    overflow: hidden;
    animation: fade-in 280ms ease-out;
  }

  @keyframes fade-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .screen { animation: none; }
  }

  .center {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  /* Month card */
  .month-card { display: flex; flex-direction: column; align-items: center; }
  .month { font-size: clamp(2rem, 9vw, 2.6rem); font-weight: 600; letter-spacing: -0.01em; }
  .age { margin-top: 10px; font-size: 1.15rem; color: var(--muted); }

  /* Decision */
  .situation {
    font-size: calc(clamp(1.35rem, 5.4vw, 1.75rem) * var(--fit));
    line-height: 1.38;
    font-weight: 500;
    max-width: 30ch;
    text-wrap: pretty;
  }

  .options {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: calc(10px * var(--fit));
    padding-top: 16px;
  }

  .option {
    font: inherit;
    font-size: calc(1.05rem * var(--fit));
    line-height: 1.3;
    text-align: left;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: calc(15px * var(--fit)) 18px;
    min-height: 54px;
    width: 100%;
    cursor: pointer;
    touch-action: manipulation;
  }
  .option:active, .option.chosen { background: var(--surface-press); border-color: var(--accent); }
  .option:disabled { cursor: default; }

  /* Immediate result and callback */
  .tap-screen { cursor: pointer; }
  .result { font-size: clamp(1.35rem, 5.4vw, 1.75rem); line-height: 1.4; max-width: 28ch; text-wrap: pretty; }
  .callback {
    font-size: clamp(1.25rem, 5vw, 1.6rem);
    line-height: 1.45;
    max-width: 28ch;
    color: var(--accent);
    text-wrap: pretty;
  }
  .hint { flex: 0 0 auto; text-align: center; font-size: 0.85rem; color: var(--muted); opacity: 0.7; }

  /* End questions */
  .question { font-size: clamp(1.35rem, 5.4vw, 1.75rem); line-height: 1.38; font-weight: 500; max-width: 26ch; }
  .actions { flex: 0 0 auto; display: flex; flex-direction: column; gap: 10px; padding-top: 16px; }
  .primary {
    font: inherit;
    font-size: 1.05rem;
    color: var(--bg);
    background: var(--text);
    border: 0;
    border-radius: 14px;
    min-height: 54px;
    width: 100%;
    cursor: pointer;
  }
  .primary:active { opacity: 0.85; }
  .secondary {
    font: inherit;
    font-size: 1rem;
    color: var(--text);
    background: none;
    border: 1px solid var(--border);
    border-radius: 14px;
    min-height: 54px;
    width: 100%;
    cursor: pointer;
  }
  .secondary:active { background: var(--surface-press); }
  .answer {
    font: inherit;
    font-size: 1.05rem;
    line-height: 1.4;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    width: 100%;
    min-height: 120px;
    resize: none;
    margin-top: 20px;
  }
  .answer:focus { outline: none; border-color: var(--accent); }
  .ask-top { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; }
</style>
</head>

  var stage = document.getElementById("stage");
  var quitButton = document.getElementById("quit");
  var title = document.getElementById("title");

  var state = {
    index: 0,          // next decision to show
    lastMonth: null,   // month of the last month card shown
    pending: [],       // callbacks waiting for their month: { month, order, text }
    choices: 0,        // number of choices made, used to order callbacks
    picked: {},        // option ids chosen so far, for rule 29 below
    finished: false
  };
  var current = { kind: null, shownAt: 0 };  // the screen on display
  var timer = null;
  var fitCurrent = null;

  // ---------- event log ----------
  // Events from every session on this device are kept together, so one
  // download collects all testers. Storage is a mirror only: if it fails,
  // the in-memory array still works and the CSV still downloads.

  var CSV_COLUMNS = ["session_id", "timestamp", "event", "decision_id", "option_id", "ms_on_screen", "screen", "value"];
  var events = loadEvents();
  var sessionId = null;

  function loadEvents() {
    try {
      var parsed = JSON.parse(window.localStorage.getItem(STORAGE_KEY) || "[]");
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      return [];
    }
  }

  function saveEvents() {
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
    } catch (e) {
      // Storage full, blocked or unavailable. Keep going in memory.
    }
  }

  function logEvent(event, fields) {
    var entry = {
      session_id: sessionId,
      timestamp: new Date().toISOString(),
      event: event,
      decision_id: "",
      option_id: "",
      ms_on_screen: "",
      screen: current.kind || "",
      value: ""
    };
    for (var key in fields) entry[key] = fields[key];
    events.push(entry);
    saveEvents();
  }

  function msOnScreen() {
    return Math.round(performance.now() - current.shownAt);
  }

  function newSessionId() {
    return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
  }

  function csvCell(value) {
    var text = value == null ? "" : String(value);
    if (/^[=+\-@\t\r]/.test(text)) text = "'" + text;  // stop spreadsheets running free text as a formula
    if (/[",\r\n]/.test(text)) text = '"' + text.replace(/"/g, '""') + '"';
    return text;
  }

  function downloadCsv() {
    var lines = [CSV_COLUMNS.join(",")];
    events.forEach(function (entry) {
      lines.push(CSV_COLUMNS.map(function (col) { return csvCell(entry[col]); }).join(","));
    });
    var blob = new Blob(["﻿" + lines.join("\r\n") + "\r\n"], { type: "text/csv;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var stamp = new Date().toISOString().slice(0, 16).replace(/[-:]/g, "").replace("T", "-");
    var link = el("a");
    link.href = url;
    link.download = "phase0_events_" + stamp + ".csv";
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
  }

  // Hidden: long-press the title to download at any point.
  (function () {
    var pressTimer = null;
    function cancel() { clearTimeout(pressTimer); }
    title.addEventListener("pointerdown", function () {
      cancel();
      pressTimer = setTimeout(downloadCsv, LONG_PRESS_MS);
    });
    ["pointerup", "pointerleave", "pointercancel"].forEach(function (type) {
      title.addEventListener(type, cancel);
    });
    title.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  })();

  // ---------- rendering helpers ----------

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  function show(screen, kind, options) {
    options = options || {};
    clearTimeout(timer);
    timer = null;
    fitCurrent = null;
    if (options.hideQuit) disarmQuit();
    quitButton.hidden = !!options.hideQuit;
    current = { kind: kind, shownAt: performance.now() };
    screen.dataset.shownAt = String(Date.now());
    stage.replaceChildren(screen);
    return screen;
  }

  function tooSoon(screen) {
    return Date.now() - Number(screen.dataset.shownAt) < TAP_GUARD_MS;
  }

  function afterDelay(ms, fn) {
    clearTimeout(timer);
    timer = setTimeout(fn, ms);
  }

  // A tap-to-skip screen that also advances on its own.
  function timedScreen(screen, kind, ms, next) {
    var advanced = false;
    function go() {
      if (advanced) return;
      advanced = true;
      next();
    }
    screen.classList.add("tap-screen");
    screen.addEventListener("click", function () {
      if (tooSoon(screen)) return;
      go();
    });
    show(screen, kind);
    afterDelay(ms, go);
  }

  // Shrink the decision screen until it fits without scrolling.
  function fitToScreen(screen) {
    var scale = 1;
    screen.style.setProperty("--fit", scale);
    while (screen.scrollHeight > screen.clientHeight + 1 && scale > 0.6) {
      scale = Math.round((scale - 0.05) * 100) / 100;
      screen.style.setProperty("--fit", scale);
    }
  }

  window.addEventListener("resize", function () {
    if (fitCurrent) fitCurrent();
  });

  function downloadButton() {
    var actions = el("div", "actions");
    var button = el("button", "secondary", "Download CSV");
    button.type = "button";
    button.addEventListener("click", downloadCsv);
    actions.appendChild(button);
    return actions;
  }

  // ---------- quit, with a second tap to confirm ----------

  var quitArmedAt = 0;
  var quitTimer = null;

  function disarmQuit() {
    clearTimeout(quitTimer);
    quitArmedAt = 0;
    quitButton.textContent = "Quit";
    quitButton.classList.remove("armed");
  }

  quitButton.addEventListener("click", function () {
    if (!quitArmedAt) {
      quitArmedAt = Date.now();
      quitButton.textContent = "Tap again to quit";
      quitButton.classList.add("armed");
      quitTimer = setTimeout(disarmQuit, QUIT_CONFIRM_MS);
      return;
    }
    if (Date.now() - quitArmedAt < TAP_GUARD_MS) return;  // an accidental double tap is not a confirmation
    disarmQuit();
    quit();
  });

  // ---------- flow ----------

  function showStart() {
    var screen = el("section", "screen");
    var center = el("div", "center");
    center.appendChild(el("p", "month", "Chapter 1"));
    screen.appendChild(center);
    var actions = el("div", "actions");
    var start = el("button", "primary", "Start");
    start.type = "button";
    start.addEventListener("click", function () {
      sessionId = newSessionId();
      logEvent("session_start", {});
      nextDecision();
    });
    actions.appendChild(start);
    screen.appendChild(actions);
    show(screen, "start", { hideQuit: true });
  }

  function nextDecision() {
    if (state.index >= DECISIONS.length) {
      showWantMore();
      return;
    }
    var decision = DECISIONS[state.index];
    if (decision.month !== state.lastMonth) {
      state.lastMonth = decision.month;
      showMonthCard(decision, function () { showCallbacks(decision); });
    } else {
      showCallbacks(decision);
    }
  }

  function showMonthCard(decision, next) {
    var screen = el("section", "screen");
    var center = el("div", "center");
    var line = el("p", "month-card");
    line.appendChild(el("span", "month", "Month " + decision.month + "."));
    line.appendChild(document.createTextNode(" "));
    line.appendChild(el("span", "age", "You are " + decision.age + "."));
    center.appendChild(line);
    screen.appendChild(center);
    show(screen, "month");
    afterDelay(MONTH_CARD_MS, next);
  }

  // Callbacks due on or before this decision's month, oldest first.
  function showCallbacks(decision) {
    var due = state.pending
      .filter(function (c) { return c.month <= decision.month; })
      .sort(function (a, b) { return a.month - b.month || a.order - b.order; });
    state.pending = state.pending.filter(function (c) { return c.month > decision.month; });

    (function step(i) {
      if (i >= due.length) {
        showDecision(decision);
        return;
      }
      var screen = el("section", "screen");
      var center = el("div", "center");
      center.appendChild(el("p", "callback", due[i].text));
      screen.appendChild(center);
      screen.appendChild(el("p", "hint", "Tap to continue"));
      timedScreen(screen, "callback", CALLBACK_MS, function () { step(i + 1); });
    })(0);
  }

  // Rule 29 (maths doc section 10): an option that cannot apply is not offered. With no engine,
  // the harness reads it from what the tester chose: an option that modifies commitments needs
  // one of those options chosen, "index" needs D16-A, "no_index" needs it not chosen.
  function offered(option) {
    var targets = option.modifies_commitment || [];
    if (targets.length && !targets.some(function (t) { return state.picked[t]; })) return false;
    if (option.requires === "index") return !!state.picked["D16-A"];
    if (option.requires === "no_index") return !state.picked["D16-A"];
    return true;
  }

  function showDecision(decision) {
    var screen = el("section", "screen");
    var center = el("div", "center");
    center.appendChild(el("p", "situation", decision.situation_text));
    screen.appendChild(center);

    var list = el("div", "options");
    var buttons = decision.options.filter(offered).map(function (option) {
      var button = el("button", "option", option.option_label);
      button.type = "button";
      button.addEventListener("click", function () {
        if (tooSoon(screen)) return;
        buttons.forEach(function (b) { b.disabled = true; });
        button.classList.add("chosen");
        choose(decision, option);
      });
      list.appendChild(button);
      return button;
    });
    screen.appendChild(list);

    show(screen, "decision");
    fitCurrent = function () { fitToScreen(screen); };
    fitCurrent();
  }

  function choose(decision, option) {
    logEvent("choice", {
      decision_id: decision.decision_id,
      option_id: option.option_id,
      ms_on_screen: msOnScreen()
    });
    state.choices += 1;
    state.picked[option.option_id] = true;
    if (option.deferred_offset_months > 0 && option.deferred_text) {
      state.pending.push({
        month: decision.month + option.deferred_offset_months,
        order: state.choices,
        text: option.deferred_text
      });
    }
    showImmediate(option);
  }

  function showImmediate(option) {
    var screen = el("section", "screen");
    var center = el("div", "center");
    center.appendChild(el("p", "result", option.immediate_text));
    screen.appendChild(center);
    screen.appendChild(el("p", "hint", "Tap to continue"));
    timedScreen(screen, "immediate", IMMEDIATE_MS, function () {
      state.index += 1;
      nextDecision();
    });
  }

  function showWantMore() {
    var screen = el("section", "screen");
    var center = el("div", "center");
    center.appendChild(el("p", "question", "Do you want to know what happens next?"));
    screen.appendChild(center);
    var actions = el("div", "actions");
    ["Yes", "No"].forEach(function (label) {
      var button = el("button", "option", label);
      button.type = "button";
      button.addEventListener("click", function () {
        if (tooSoon(screen)) return;
        logEvent("want_next", { value: label, ms_on_screen: msOnScreen() });
        showLongestDecision();
      });
      actions.appendChild(button);
    });
    screen.appendChild(actions);
    show(screen, "want_next");
  }

  function showLongestDecision() {
    var screen = el("section", "screen");
    var top = el("div", "ask-top");
    var label = el("label", "question", "Which decision did you think about longest?");
    label.htmlFor = "longest";
    top.appendChild(label);
    var answer = el("textarea", "answer");
    answer.id = "longest";
    answer.rows = 4;
    top.appendChild(answer);
    screen.appendChild(top);
    var actions = el("div", "actions");
    var done = el("button", "primary", "Done");
    done.type = "button";
    done.addEventListener("click", function () {
      logEvent("longest_decision", { value: answer.value.trim(), ms_on_screen: msOnScreen() });
      showThanks();
    });
    actions.appendChild(done);
    screen.appendChild(actions);
    show(screen, "longest_decision");
  }

  function showThanks() {
    state.finished = true;
    var screen = el("section", "screen");
    var center = el("div", "center");
    center.appendChild(el("p", "question", "Thank you."));
    screen.appendChild(center);
    screen.appendChild(downloadButton());
    show(screen, "end", { hideQuit: true });
    logEvent("session_end", {});
  }

  function quit() {
    if (state.finished) return;
    state.finished = true;
    var decision = DECISIONS[state.index];
    logEvent("quit", {
      decision_id: decision ? decision.decision_id : "",
      ms_on_screen: msOnScreen()
    });
    var screen = el("section", "screen");
    var center = el("div", "center");
    center.appendChild(el("p", "question", "You stopped here. Thank you."));
    screen.appendChild(center);
    screen.appendChild(downloadButton());
    show(screen, "quit", { hideQuit: true });
  }

  showStart();
})();
</script>
</body>
</html>
