<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360" fill="none">
  <!-- Sketch for LANDING-MOTION.md, direction D. Not in the game. A figure drawn in the
       illustrations' vocabulary: circles, rounded rectangles and strokes, flat colour, no face,
       no gradients. Left: the 390 by 286 frame every illustration uses. Right: the same drawing
       in the band the landing could spare on a 320 by 568 phone. -->
  <rect width="1040" height="360" fill="#0E1016"/>
  <text x="20" y="24" fill="#7C8296" font-family="system-ui, sans-serif" font-size="13">Direction D sketch: the illustration frame, 390 by 286</text>
  <text x="440" y="24" fill="#7C8296" font-family="system-ui, sans-serif" font-size="13">The same, in a 320 by 100 band above the title</text>

  <defs>
    <g id="scene">
      <rect width="390" height="286" fill="#1B3A5C"/>
      <circle cx="318" cy="52" r="96" fill="#22486E"/>
      <rect x="40" y="246" width="310" height="6" rx="3" fill="#22486E"/>
      <!-- the figure: no face, neutral tones, so it is nobody in particular -->
      <rect x="150" y="194" width="17" height="54" rx="6" fill="#8C8578"/>
      <rect x="173" y="194" width="17" height="54" rx="6" fill="#8C8578"/>
      <rect x="140" y="120" width="60" height="82" rx="20" fill="#B9BECD"/>
      <circle cx="170" cy="94" r="22" fill="#E0D9CB"/>
      <path d="M146 134 L134 180" stroke="#B9BECD" stroke-width="14" stroke-linecap="round"/>
      <path d="M195 134 L222 160" stroke="#B9BECD" stroke-width="14" stroke-linecap="round"/>
      <!-- the first payslip, D01's, held up -->
      <rect x="222" y="128" width="50" height="64" rx="3" fill="#F2ECE0"/>
      <rect x="222" y="128" width="50" height="13" rx="3" fill="#D6402C"/>
      <rect x="230" y="152" width="26" height="4" rx="2" fill="#B9BECD"/>
      <rect x="230" y="162" width="20" height="4" rx="2" fill="#B9BECD"/>
      <rect x="248" y="176" width="18" height="8" rx="2" fill="#F0A830"/>
      <!-- the coin from D01 -->
      <circle cx="300" cy="226" r="20" fill="#F0A830"/>
      <path d="M293 218h14M293 223h14M300 223c5 0 6 2 6 5 0 3-2 5-6 5l9 8" stroke="#1B3A5C" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <clipPath id="frame"><rect x="20" y="40" width="390" height="286"/></clipPath>
    <clipPath id="band"><rect x="440" y="40" width="320" height="100"/></clipPath>
  </defs>

  <g clip-path="url(#frame)"><use href="#scene" x="20" y="40"/></g>

  <!-- 320 by 100: the whole scene scaled to the band's height, centred -->
  <rect x="440" y="40" width="320" height="100" fill="#1B3A5C"/>
  <g clip-path="url(#band)">
    <use href="#scene" transform="translate(538 40) scale(0.35)"/>
  </g>
  <rect x="440" y="40" width="320" height="100" stroke="#3C4356"/>
  <text x="440" y="164" fill="#7C8296" font-family="system-ui, sans-serif" font-size="13">At 320 by 568 the landing has 11 px spare: a band this size</text>
  <text x="440" y="182" fill="#7C8296" font-family="system-ui, sans-serif" font-size="13">means giving up the mark (68 px) and about 20 px of text spacing.</text>
  <text x="440" y="200" fill="#7C8296" font-family="system-ui, sans-serif" font-size="13">The figure is then about 60 px tall.</text>
</svg>
